name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: 补全 Gradle Wrapper
        run: |
          set -e
          VER=$(sed -n 's/.*gradle-\([0-9.]*\)-all\.zip.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          echo "Gradle 版本: $VER"
          curl -sSLo /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${VER}-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          mkdir -p /tmp/wrapgen && cd /tmp/wrapgen
          echo 'rootProject.name = "wrapgen"' > settings.gradle.kts
          "/tmp/gradle-${VER}/bin/gradle" wrapper --gradle-version "${VER}" --distribution-type all
          cp -r /tmp/wrapgen/gradle /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat "$GITHUB_WORKSPACE/android/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          ls -l "$GITHUB_WORKSPACE/android/gradle/wrapper/" "$GITHUB_WORKSPACE/android/gradlew"

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
